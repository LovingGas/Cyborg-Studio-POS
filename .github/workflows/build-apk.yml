name: Build APK

# Builds the debug APK in the cloud (this project's local VM cannot run
# Gradle). The finished APK appears under the run's Artifacts as
# "all-in-one-pos-debug-apk" — see CLOUD_BUILD.md.
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Analyze, test and build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml uses relative path deps (vendor/sqlite3,
      # vendor/sqlite3_flutter_libs) that live inside this repo, so a plain
      # online `flutter pub get` resolves everything on the runner.
      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-in-one-pos-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
