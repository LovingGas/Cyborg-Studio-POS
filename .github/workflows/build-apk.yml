name: Build APK

# Builds release APKs in the cloud (this project's local VM cannot run
# Gradle). The finished APKs appear under the run's Artifacts as
# "cyborg-studio-pos-apks" — see CLOUD_BUILD.md.
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Analyze, test and build release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml uses relative path deps (vendor/sqlite3,
      # vendor/sqlite3_flutter_libs) that live inside this repo, so a plain
      # online `flutter pub get` resolves everything on the runner.
      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Release + split-per-abi keeps each APK small (the universal debug
      # APK was ~151 MB and failed to download/install on the phone).
      # Most phones need app-arm64-v8a-release.apk.
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyborg-studio-pos-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
